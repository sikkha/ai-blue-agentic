# Staging template. Install only after validating the origin certificate and ingress.
server {
    listen 80;
    server_name public.geopolitics.io;
    include /etc/ai-blue/acme-challenge.conf;
    location / { return 403; }
}

server {
    listen 443 ssl;
    server_name public.geopolitics.io;
    ssl_certificate /etc/ai-blue/tls/public.geopolitics.io.crt;
    ssl_certificate_key /etc/ai-blue/tls/public.geopolitics.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Populate set_real_ip_from only with Cloudflare's published proxy ranges.
    include /etc/ai-blue/cloudflare-real-ip.conf;
    real_ip_header CF-Connecting-IP;

    include /etc/ai-blue/acme-challenge.conf;
    client_max_body_size 52m;

    location / {
        proxy_pass http://127.0.0.1:8186;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
    }
}
